name: opencode
label: OpenCode
description: Open-source terminal-native AI coding agent
homepage: https://opencode.ai
tags: [coding, open-source, cli, terminal]
builtin: true

install:
  binary: opencode
  requires: [nodejs]
  macos: "npm install -g opencode-ai@latest"
  linux: "npm install -g opencode-ai@latest"
  windows: "npm install -g opencode-ai@latest"

adapter:
  module: openagents.adapters.opencode
  class: OpenCodeAdapter

launch:
  args: []

env_config:
  - name: LLM_API_KEY
    description: LLM provider API key
    required: false
    password: true
  - name: OPENAI_API_KEY
    description: OpenAI API key
    required: false
    password: true
  - name: ANTHROPIC_API_KEY
    description: Anthropic API key
    required: false
    password: true
  - name: LLM_BASE_URL
    description: OpenAI-compatible base URL
    required: false
    placeholder: "https://api.openai.com/v1"
  - name: LLM_MODEL
    description: Model name
    required: false
    placeholder: "gpt-5.4, claude-sonnet-4-5, deepseek-chat, etc."
  - name: OPENCODE_MODEL
    description: Optional OpenCode model override
    required: false
    placeholder: "openai/gpt-5.4 or anthropic/claude-sonnet-4-5"

check_ready:
  env_vars: [LLM_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY]
  saved_env_key: LLM_API_KEY
  not_ready_message: "No model provider credentials configured — press e to configure"
