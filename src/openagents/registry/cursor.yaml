name: cursor
label: Cursor
description: Cursor official CLI agent
homepage: https://cursor.com
tags: [coding, editor, cli, ai]
builtin: true

install:
  binary: cursor-agent
  requires: []
  macos: "curl https://cursor.com/install -fsSL | bash"
  linux: "curl https://cursor.com/install -fsSL | bash"
  windows: "echo 'Download Cursor from https://cursor.com/downloads'"

adapter:
  module: openagents.adapters.cursor
  class: CursorAdapter

launch:
  args: []

env_config:
  - name: CURSOR_API_KEY
    description: Cursor API key
    required: true
    password: true
  - name: CURSOR_MODEL
    description: Optional Cursor model override
    required: false
    placeholder: "claude-4-sonnet, gpt-5, auto, etc."

check_ready:
  env_vars: [CURSOR_API_KEY]
  saved_env_key: CURSOR_API_KEY
  not_ready_message: "Cursor API key not configured — press e to configure"
