# OpenAgents Password-Protected Network Configuration Example
# 
# This example shows how to configure a network with password protection.
# To generate a password hash, use:
#   python scripts/generate_network_password.py

network:
  name: "SecureAgentsNetwork"
  mode: "centralized"
  
  # Password protection settings
  require_password: true
  # Replace this hash with one generated using scripts/generate_network_password.py
  # This example hash is for the password "secure_network_2024"
  password_hash: "$2b$12$example.hash.replace.with.your.own.generated.hash"
  
  # Security configuration
  encryption_enabled: true
  encryption_type: "noise"
  disable_agent_secret_verification: false
  
  # Network configuration
  transports:
    - type: "http"
      config: {}
    - type: "grpc" 
      config: {}
  
  manifest_transport: "http"
  recommended_transport: "grpc"
  max_connections: 50
  
  # Discovery and connection settings
  discovery_enabled: true
  discovery_interval: 5
  connection_timeout: 30.0
  retry_attempts: 3
  heartbeat_interval: 30
  
  # Mods to load
  mods:
    - name: "openagents.mods.workspace.messaging"
      enabled: true
      config: {}
    - name: "openagents.mods.workspace.default"
      enabled: true
      config: {}

# Optional metadata
metadata:
  description: "A secure OpenAgents network with password protection"
  created_by: "Network Administrator"
  security_level: "high"