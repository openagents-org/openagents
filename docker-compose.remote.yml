services:
  openagents:
    image: ghcr.io/openagents-org/openagents:latest
    container_name: openagents-network-studio
    ports:
      - "8700:8700"
      - "8600:8600"
      - "8050:8050"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8700/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # sample-agent:
  #   image: ghcr.io/openagents-org/openagents:latest
  #   container_name: openagents-sample-agent
  #   depends_on:
  #     openagents:
  #       condition: service_healthy
  #   environment:
  #     - NETWORK_HOST=openagents
  #     - NETWORK_PORT=8700
