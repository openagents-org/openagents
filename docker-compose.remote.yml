  #     - AGENT_MODEL_NAME=demo-model
  #   volumes:
  #     - ./examples/agents:/workspace/examples/agents
  #   working_dir: /workspace/examples/agents
  #   entrypoint: ["python", "simple_worker_agent_example.py"]
  #   restart: unless-stopped

  llm-agent:
    image: ghcr.io/openagents-org/openagents:latest
    container_name: openagents-llm-demo
    depends_on:
      openagents:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NETWORK_HOST=openagents
      - NETWORK_PORT=8700
      - AGENT_INSTRUCTION=You are an LLM agent answering questions for the OpenAgents demo.
      - AGENT_PROVIDER=${PROVIDER-openai}
    volumes:
      - ./examples/agents:/workspace/examples/agents
    working_dir: /workspace/examples/agents
    entrypoint: ["python", "llm_worker_agent.py"]
    restart: unless-stopped

  poet-agent:
    image: ghcr.io/openagents-org/openagents:latest
    container_name: openagents-chinese-poet
    depends_on:
      openagents:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - NETWORK_HOST=openagents
      - NETWORK_PORT=8700
      - AGENT_INSTRUCTION=你是一位通晓古典诗词的AI诗人。
      - AGENT_PROVIDER=${PROVIDER-openai}
    volumes:
      - ./examples/agents:/workspace/examples/agents
    working_dir: /workspace/examples/agents
    entrypoint: ["python", "chinese_poet_agent.py"]
    restart: unless-stopped
