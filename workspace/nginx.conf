upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;

    # Redirect root path to main site (SEO: avoid brand keyword cannibalization)
    location = / {
        return 301 https://openagents.org/workspace;
    }

    # File uploads → backend. Only the two upload endpoints accept large
    # bodies (exact-match locations, so GET /v1/files/{id} and other file
    # routes keep the default limit). The backend's MAX_FILE_SIZE is 50MB;
    # the multipart route gets headroom for boundary and part headers so a
    # file of exactly 50MB is not 413'd here, and the base64 route gets
    # ~4/3 encoding overhead on top. The backend enforces the precise
    # per-file limit either way. nginx defaults to 1m, which rejected
    # image uploads before they ever reached the backend.
    location = /v1/files {
        client_max_body_size 52m;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/files/base64 {
        client_max_body_size 70m;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API requests → backend
    location /v1/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
