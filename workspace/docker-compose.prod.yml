services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openagents_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-changeme}@db:5432/openagents_workspace
      AUTH_MODE: ${AUTH_MODE:-workspace_token}
      IDENTITY_MODE: standalone
      CORS_ORIGINS: ${CORS_ORIGINS:-https://workspace.openagents.org,openagents://workspace}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://workspace.openagents.org}
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://workspace-endpoint.openagents.org}
      WORKSPACE_SESSION_SECRET: ${WORKSPACE_SESSION_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-email}
      OIDC_NAME_CLAIM: ${OIDC_NAME_CLAIM:-name}
      OIDC_REQUIRE_EMAIL_VERIFICATION: ${OIDC_REQUIRE_EMAIL_VERIFICATION:-true}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_TOKEN_ENDPOINT_AUTH_METHOD: ${OIDC_TOKEN_ENDPOINT_AUTH_METHOD:-client_secret_basic}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-Company SSO}
      OIDC_COOKIE_SECURE: ${OIDC_COOKIE_SECURE:-true}
      OIDC_ALLOW_INSECURE_HTTP: ${OIDC_ALLOW_INSECURE_HTTP:-false}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-https://workspace-endpoint.openagents.org}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
