# Installed as /opt/openagents-preview/docker-compose.yml.
# Shares production records and file storage. There is deliberately NO migrate service.
name: openagents-preview
services:
  backend:
    image: openagents-backend:release-8eeea530d70c39ca67b25c12b111518330542fc4
    env_file:
      - path: ./secrets/production-beta.env
        format: raw
    environment:
      BACKGROUND_JOBS_ENABLED: 'false'
      DB_POOL_SIZE: '2'
      DB_MAX_OVERFLOW: '0'
      THREADPOOL_TOKENS: '2'
      WEB_CONCURRENCY: '2'
      REDIS_URL: ''
    entrypoint: ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000', '--workers', '2', '--no-access-log']
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=8)"]
      interval: 20s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'

  frontend:
    image: openagents-preview-frontend:latest
    command: ['./node_modules/.bin/next', 'dev', '--webpack', '--hostname', '0.0.0.0', '--port', '3000']
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: https://workspace-preview.openagents.org
      NEXT_PUBLIC_FIRST_PARTY_HOSTNAMES: workspace-preview.openagents.org
      NEXT_PUBLIC_INLINE_LOGIN: '1'
      NEXT_DEV_ALLOWED_ORIGIN: workspace-preview.openagents.org
    volumes:
      - ./repo/workspace/frontend:/app
      - frontend_dev_modules:/app/node_modules
      - frontend_dev_cache:/app/.next
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_headers.inc:/etc/nginx/conf.d/proxy_headers.inc:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  frontend_dev_modules:
    external: true
    name: openagents-preview_frontend_dev_modules
  frontend_dev_cache:
    external: true
    name: openagents-preview_frontend_dev_cache
