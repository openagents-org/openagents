# Repo-wide tooling config for the OpenAgents workspace + launcher monorepo.
#
# The Python network SDK (the `openagents` package) now lives in its own repo:
#   https://github.com/openagents-org/openagents-network-sdk
# It is consumed here as a dependency (see workspace/backend/requirements.txt).

# Pytest configuration — the workspace backend test suite.
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",                      # Show extra test summary
    "--strict-markers",         # Treat unregistered markers as errors
    "--strict-config",          # Treat config issues as errors
    "--disable-warnings",       # Disable most warnings for cleaner output
]
testpaths = ["workspace/backend/tests"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark a test as an asyncio test",
    "timeout: mark a test with a timeout",
    "integration: mark a test as an integration test (slower, requires network setup)",
    "unit: mark a test as a unit test (fast, isolated)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::RuntimeWarning:asyncio",
]

# Coverage configuration
[tool.coverage.run]
source = ["workspace/backend/app"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 120
src = ["workspace/backend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["openagents"]

[tool.ruff.format]
quote-style = "double"
