name: amp
label: Amp (Sourcegraph)
description: Sourcegraph's AI coding agent for CLI and VS Code
homepage: https://ampcode.com
tags: [coding, sourcegraph, cli, vscode]
builtin: true
support:
  install: true
  workspace: true
  collaboration: true

install:
  binary: amp
  macos: "curl -fsSL https://ampcode.com/install.sh | bash"
  linux: "curl -fsSL https://ampcode.com/install.sh | bash"
  windows: "powershell -c \"irm https://ampcode.com/install.ps1 | iex\""

adapter:
  module: openagents.adapters.amp
  class: AmpAdapter

launch:
  args: []

env_config:
  - name: AMP_API_KEY
    description: Amp API key (create one at https://ampcode.com/settings) — leave blank if you have run `amp login`
    required: false
    password: true
  - name: AMP_URL
    description: Amp server URL for enterprise/self-hosted deployments (leave blank for the default)
    required: false

check_ready:
  login_command: "amp login"
  # Shown when the Amp CLI IS installed but no usable auth was detected. It must
  # NOT say "Not installed" — that wording is reserved for a genuinely missing
  # executable. A signed-out-but-installed agent is a Login-required state, not a
  # missing-install state (see launcher _reconcileAgentHealth / formatHealthLabel).
  not_ready_message: "Amp is installed but not signed in — run: amp login or set AMP_API_KEY"
