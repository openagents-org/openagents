name: gemini
label: Gemini CLI
description: Google's open-source AI agent for the command line
homepage: https://github.com/google-gemini/gemini-cli
tags: [coding, google, open-source, cli]

install:
  binary: gemini
  requires: [nodejs]
  macos: "npm install -g @google/gemini-cli"
  linux: "npm install -g @google/gemini-cli"
  windows: "npm install -g @google/gemini-cli"

# Readiness covers BOTH of Gemini CLI's auth paths: the default OAuth login
# (credentials cached at ~/.gemini/oauth_creds.json — detected by existence,
# never parsed) and API-key / service-account env vars. creds_no_parse keeps
# the check content-free; creds_path_env validates that
# GOOGLE_APPLICATION_CREDENTIALS points at a real readable file.
check_ready:
  creds_file: "~/.gemini/oauth_creds.json"
  creds_no_parse: true
  creds_path_env: [GOOGLE_APPLICATION_CREDENTIALS]
  env_vars: [GEMINI_API_KEY, GOOGLE_API_KEY]
  saved_env_key: GEMINI_API_KEY
  login_command: "gemini"
  not_ready_message: "Needs sign-in — run `gemini` to sign in, or set GEMINI_API_KEY."
  unreadable_message: "Gemini credentials were found but could not be read. Check permissions on ~/.gemini, or run `gemini` to sign in again."
  # Non-sensitive, human-readable labels for a READY auth_mode. Surfaced by the
  # connector TUI/CLI and the launcher Configure dialog so a Google sign-in is
  # distinguished from an API key. Never contains a token, email, or path.
  auth_detected_labels:
    cli_login: "Google account sign-in detected"
    api_key: "API key detected"
