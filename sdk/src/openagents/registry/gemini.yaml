name: gemini
label: Gemini CLI
description: Google's Gemini CLI (legacy — superseded by Antigravity CLI; needs a Gemini API key or Code Assist license since June 2026)
homepage: https://github.com/google-gemini/gemini-cli
tags: [coding, google, open-source, cli]

install:
  binary: gemini
  requires: [nodejs]
  macos: "npm install -g @google/gemini-cli"
  linux: "npm install -g @google/gemini-cli"
  windows: "npm install -g @google/gemini-cli"

# Readiness covers BOTH of Gemini CLI's auth paths: the default OAuth login
# (detected from the account the CLI records, never from the token itself) and
# API-key / service-account env vars. creds_no_parse keeps the check
# content-free — the recorded address is tested for emptiness, never read out;
# creds_path_env validates that GOOGLE_APPLICATION_CREDENTIALS points at a real
# readable file.
check_ready:
  # The signed-in Google address, which the CLI writes on every successful
  # OAuth flow and nulls on sign-out. It used to be oauth_creds.json — current
  # builds keep the token in the OS keychain and never write that file, so the
  # check could never come back true however many times the user signed in.
  # creds_key is what makes `active: null` (signed out) read as signed out;
  # the file itself exists from install onward.
  creds_file: "~/.gemini/google_accounts.json"
  creds_key: "active"
  creds_no_parse: true
  creds_path_env: [GOOGLE_APPLICATION_CREDENTIALS]
  env_vars: [GEMINI_API_KEY, GOOGLE_API_KEY]
  saved_env_key: GEMINI_API_KEY
  login_command: "gemini"
  not_ready_message: "Set GEMINI_API_KEY (Google ended individual sign-in for Gemini CLI in June 2026), or run `gemini` if your org has a Code Assist license."
  unreadable_message: "Gemini credentials were found but could not be read. Check permissions on ~/.gemini, or run `gemini` to sign in again."
  # Non-sensitive, human-readable labels for a READY auth_mode. Surfaced by the
  # connector TUI/CLI and the launcher Configure dialog so a Google sign-in is
  # distinguished from an API key. Never contains a token, email, or path.
  auth_detected_labels:
    cli_login: "Google account sign-in detected"
    api_key: "API key detected"
