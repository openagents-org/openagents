name: nanoclaw
label: NanoClaw
description: >-
  Containerized agent runtime — each Agent Group runs in its own Docker
  container (Claude Agent SDK). Bridged to the Workspace via a native
  OpenAgents channel.
homepage: https://github.com/nanocoai/nanoclaw
tags: [coding, container, docker, runtime, open-source]

# NanoClaw is an external containerized runtime the user sets up themselves.
# The actual Workspace bridge runs in the Node launcher (adapters/index.js →
# NanoClawAdapter); this catalog entry is informational for the Python SDK
# (no builtin / no Python adapter — same pattern as cline.yaml).
support: { install: true, workspace: true, collaboration: false }

install:
  binary: ncl
  requires: [nodejs, docker, git]
  macos: "echo 'NanoClaw is an external containerized runtime. Set it up from https://github.com/nanocoai/nanoclaw (clone, pnpm install, ./nanoclaw.sh setup), symlink bin/ncl onto PATH, then install the OpenAgents channel (/add-openagents). See docs/agents/nanoclaw.md.'"
  linux: "echo 'NanoClaw is an external containerized runtime. Set it up from https://github.com/nanocoai/nanoclaw (clone, pnpm install, ./nanoclaw.sh setup), symlink bin/ncl onto PATH, then install the OpenAgents channel (/add-openagents). See docs/agents/nanoclaw.md.'"
  windows: "echo 'NanoClaw requires Docker Desktop + WSL2 on Windows. Set it up inside WSL2 from https://github.com/nanocoai/nanoclaw, symlink bin/ncl onto PATH, then install the OpenAgents channel (/add-openagents). See docs/agents/nanoclaw.md.'"

env_config:
  - name: NANOCLAW_HOME
    description: Path to your NanoClaw checkout (optional if `ncl` is on PATH)
    required: false
    password: false
  - name: NANOCLAW_AGENT_GROUP
    description: NanoClaw Agent Group id or name to bridge to this agent
    required: true
    password: false

check_ready:
  env_vars: [NANOCLAW_AGENT_GROUP]
  saved_env_key: NANOCLAW_AGENT_GROUP
  not_ready_message: "Set NANOCLAW_AGENT_GROUP (and NANOCLAW_HOME) — press e to configure"
