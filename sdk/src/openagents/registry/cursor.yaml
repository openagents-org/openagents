name: cursor
label: Cursor
description: AI-powered code editor with agent mode CLI
homepage: https://cursor.com
tags: [coding, editor, cli, ai]
builtin: true

install:
  binary: cursor-agent
  binary_aliases: [agent]
  requires: []
  macos: "curl https://cursor.com/install -fsSL | bash"
  linux: "curl https://cursor.com/install -fsSL | bash"
  windows: "powershell -c \"irm 'https://cursor.com/install?win32=true' | iex\""

adapter:
  module: openagents.adapters.cursor
  class: CursorAdapter

launch:
  args: []

# Cursor authenticates ONLY against Cursor's own service: `cursor-agent login`
# on the device, or a CURSOR_API_KEY from cursor.com/settings. Third-party /
# relay keys and custom base URLs do not work — there is no OPENAI_* path.
env_config:
  - name: CURSOR_API_KEY
    description: Cursor API key for CLI authentication
    required: false
    password: true
  - name: CURSOR_MODEL
    description: Model to use (e.g. claude-sonnet-4-6, gpt-4o)
    required: false

check_ready:
  binary: agent
  env_vars: [CURSOR_API_KEY]
  not_ready_message: "Cursor is installed but not signed in — run `cursor-agent login` on the device, or set a CURSOR_API_KEY from cursor.com/settings. Third-party or relay API keys do not work with Cursor."

resolve_env:
  rules:
    - from: LLM_API_KEY
      to: CURSOR_API_KEY
    - from: LLM_MODEL
      to: CURSOR_MODEL
