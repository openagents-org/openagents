name: hermes
label: Hermes Agent
description: Nous Hermes Agent with tools, profiles, memory, and messaging support
homepage: https://github.com/NousResearch/hermes-agent
tags: [coding, tools, orchestration, profiles]
builtin: true

install:
  binary: hermes
  requires: [python3]
  # Hermes ships a curl-pipe installer that handles platform-specific
  # setup (pipx/uv/venv, PATH wiring, skill sync). There is no
  # `hermes-agent` package on PyPI.
  macos: "curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash"
  linux: "curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash"
  # Native Windows is supported via hermes-agent's PowerShell installer (no WSL
  # required): it provisions portable Python/Node/Git under %LOCALAPPDATA%\hermes
  # and drops hermes.exe in venv\Scripts. Wrap in powershell.exe so it runs even
  # when spawned from cmd. The adapter still falls back to a WSL install if one
  # is present, but native is the default.
  windows: "\"%SystemRoot%\\System32\\WindowsPowerShell\\v1.0\\powershell.exe\" -NoProfile -ExecutionPolicy Bypass -Command \"Invoke-RestMethod -UseBasicParsing 'https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.ps1' | Invoke-Expression\""

adapter:
  module: openagents.adapters.hermes
  class: HermesAdapter
  options:
    hermes_profile: auto
    hermes_source: tool
    max_turns: 60
    yolo: false

# API-key path for a custom OpenAI-compatible endpoint. All optional: the
# Nous login (`hermes setup`) remains the primary auth and must not be forced
# through key fields. When LLM_BASE_URL is set, the connector ALSO writes the
# endpoint into Hermes's own config.yaml via `hermes config set`
# (HermesAdapter.configureNativeAuth) — Hermes only honors a custom endpoint
# from its config, not from env vars. Declaring the fields here is what lets
# the workspace's remote configure_agent config-map through the allowlist.
env_config:
  - name: LLM_API_KEY
    description: API key for a custom OpenAI-compatible endpoint (optional if you sign in with `hermes setup`)
    required: false
    password: true
  - name: LLM_BASE_URL
    description: Custom OpenAI-compatible base URL (leave empty to use Hermes's own provider login)
    required: false
    placeholder: "https://api.openai.com/v1"
  - name: LLM_MODEL
    description: Model name served by the endpoint above
    required: false

resolve_env:
  rules:
    # Fallback delivery of the key into the hermes process env; the custom
    # `model:` block reads OPENAI_API_KEY when base_url is set and no inline
    # api_key is configured.
    - from: LLM_API_KEY
      to: OPENAI_API_KEY
