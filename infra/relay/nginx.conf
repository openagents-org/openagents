# OpenAgents Relay Server - Nginx Configuration
#
# HTTP only - Cloudflare handles SSL termination
#
# Setup:
# 1. Copy this file to /etc/nginx/sites-available/relay.openagents.org
#    sudo cp nginx.conf /etc/nginx/sites-available/relay.openagents.org
#
# 2. Enable the site:
#    sudo ln -s /etc/nginx/sites-available/relay.openagents.org /etc/nginx/sites-enabled/
#
# 3. Test and reload nginx:
#    sudo nginx -t && sudo systemctl reload nginx
#
# 4. Configure Cloudflare:
#    - Add relay.openagents.org to Cloudflare
#    - Set SSL/TLS mode to "Flexible" or "Full"
#    - Enable WebSockets in Network settings

upstream relay_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.openagents.org;

    client_max_body_size 10m;

    # Trust Cloudflare headers for real client IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # Logging
    access_log /var/log/nginx/relay.openagents.org.access.log;
    error_log /var/log/nginx/relay.openagents.org.error.log;

    # Health check endpoint
    location /health {
        proxy_pass http://relay_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # List connected networks
    location /networks {
        proxy_pass http://relay_backend/networks;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }
    }

    # WebSocket endpoint for local networks to register
    location /register {
        proxy_pass http://relay_backend/register;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket specific timeouts (keep connection alive)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # HTTP requests to networks - this is the main proxy path
    location /network/ {
        proxy_pass http://relay_backend/network/;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # Timeout for proxied requests
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        # CORS headers for all responses
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Request-ID' always;

        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Request-ID';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }
    }

    # Default location - return info about the relay
    location / {
        default_type application/json;
        return 200 '{"service": "OpenAgents Relay", "docs": "https://docs.openagents.org/relay", "endpoints": {"register": "/register (WebSocket)", "networks": "/networks", "proxy": "/network/{id}/*"}}';
    }
}
