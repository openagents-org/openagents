# OpenAgents Relay Server - Nginx Configuration
#
# This configuration provides TLS termination and proxies requests to the relay service.
# The relay service enables localhost networks to be publicly accessible.
#
# Setup:
# 1. Install certbot and obtain SSL certificates:
#    sudo certbot certonly --nginx -d relay.openagents.org
#
# 2. Copy this file to /etc/nginx/sites-available/relay.openagents.org
#    sudo cp nginx.conf /etc/nginx/sites-available/relay.openagents.org
#
# 3. Enable the site:
#    sudo ln -s /etc/nginx/sites-available/relay.openagents.org /etc/nginx/sites-enabled/
#
# 4. Test and reload nginx:
#    sudo nginx -t && sudo systemctl reload nginx

# Upstream definition for the relay service
upstream relay_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name relay.openagents.org;

    # Health check for load balancers (doesn't require HTTPS)
    location /health {
        proxy_pass http://relay_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main HTTPS server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relay.openagents.org;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/relay.openagents.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.openagents.org/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (optional but recommended)
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Logging
    access_log /var/log/nginx/relay.openagents.org.access.log;
    error_log /var/log/nginx/relay.openagents.org.error.log;

    # Request size limits
    client_max_body_size 10m;

    # Health check endpoint
    location /health {
        proxy_pass http://relay_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # List connected networks
    location /networks {
        proxy_pass http://relay_backend/networks;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }
    }

    # WebSocket endpoint for local networks to register
    location /register {
        proxy_pass http://relay_backend/register;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket specific timeouts (keep connection alive)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # HTTP requests to networks - this is the main proxy path
    location /network/ {
        proxy_pass http://relay_backend/network/;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeout for proxied requests
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        # CORS headers for all responses
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Request-ID' always;

        # Handle CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Request-ID';
            add_header 'Access-Control-Max-Age' 86400;
            return 204;
        }
    }

    # Default location - return info about the relay
    location / {
        default_type application/json;
        return 200 '{"service": "OpenAgents Relay", "docs": "https://docs.openagents.org/relay", "endpoints": {"register": "/register (WebSocket)", "networks": "/networks", "proxy": "/network/{id}/*"}}';
    }
}
