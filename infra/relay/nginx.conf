# OpenAgents Relay Server - Nginx Configuration
#
# HTTP only - Cloudflare handles SSL termination
#
# Setup:
# 1. Copy this file to /etc/nginx/sites-available/openagents-relay
#    sudo cp nginx.conf /etc/nginx/sites-available/openagents-relay
#
# 2. Enable the site:
#    sudo ln -s /etc/nginx/sites-available/openagents-relay /etc/nginx/sites-enabled/
#
# 3. Test and reload nginx:
#    sudo nginx -t && sudo systemctl reload nginx
#
# 4. Configure Cloudflare:
#    - Add relay.openagents.org to Cloudflare
#    - Set SSL/TLS mode to "Flexible" or "Full"
#    - Enable WebSockets in Network settings

upstream relay_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.openagents.org;

    client_max_body_size 10m;

    # Trust Cloudflare headers for real client IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # Logging
    access_log /var/log/nginx/relay.openagents.org.access.log;
    error_log /var/log/nginx/relay.openagents.org.error.log;

    # WebSocket endpoint for local networks to register
    location /register {
        proxy_pass http://relay_backend/register;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket specific timeouts (keep connection alive)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # All other requests go to the Node.js server
    # This handles: /health, /networks, /status/{id}, /{tunnelId}/*
    location / {
        proxy_pass http://relay_backend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        # Timeout for proxied requests
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        # CORS is handled by the Node.js server
    }
}
