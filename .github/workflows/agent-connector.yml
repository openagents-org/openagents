name: Agent Connector

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'packages/agent-connector/**'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'packages/agent-connector/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['20', '22', '24']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Run tests
      working-directory: packages/agent-connector
      # shell: bash ensures the `test/*.test.js` glob is expanded by bash
      # even on Windows runners (PowerShell doesn't expand globs).
      # mini.test.js (mini-SWE-agent) is excluded — that agent isn't part of the
      # supported set and its stop/SIGTERM test is unreliable on Windows.
      shell: bash
      run: node --test $(ls test/*.test.js | grep -v 'mini\.test\.js')

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    # Publishing authenticates via npm Trusted Publishing (OIDC) — no NPM_TOKEN
    # secret. The trusted publisher for this repo/workflow is configured in the
    # npm package settings. OIDC needs npm 11.5.1+; Node 22 bundles npm 10.
    - name: Update npm for OIDC trusted publishing
      run: npm install -g npm@11

    - name: Publish to npm
      working-directory: packages/agent-connector
      # Skip when this exact version is already on npm so a push to develop that
      # doesn't bump the version doesn't fail the job with E403 ("cannot publish
      # over previously published versions"). Only an actual version bump
      # publishes.
      run: |
        NAME=$(node -p "require('./package.json').name")
        VERSION=$(node -p "require('./package.json').version")
        if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
          echo "$NAME@$VERSION already published — skipping publish."
          exit 0
        fi
        npm publish --access public --provenance
