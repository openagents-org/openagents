name: Deploy isolated workspace preview

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-preview-develop
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test deployment guards
        run: python3 -m unittest discover -s workspace/operations/preview/tests -v
      - name: Build frontend and backend from the same develop commit
        env:
          PREVIEW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --file workspace/backend/production.Dockerfile \
            --build-arg RELEASE_SHA="$PREVIEW_SHA" \
            --tag "openagents-preview-backend:$PREVIEW_SHA" workspace/backend
          docker build --build-arg NEXT_PUBLIC_API_URL=https://workspace-preview.openagents.org \
            --build-arg NEXT_PUBLIC_FIRST_PARTY_HOSTNAMES=workspace-preview.openagents.org \
            --build-arg NEXT_PUBLIC_INLINE_LOGIN=1 \
            --label "org.opencontainers.image.revision=$PREVIEW_SHA" \
            --tag "openagents-preview-frontend-develop:$PREVIEW_SHA" workspace/frontend
          docker save "openagents-preview-backend:$PREVIEW_SHA" \
            "openagents-preview-frontend-develop:$PREVIEW_SHA" | gzip -1 > images.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-images-${{ github.sha }}
          path: images.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: workspace-preview-isolated
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-images-${{ github.sha }}
      - name: Stage build and deploy only to preview
        env:
          PREVIEW_DEPLOY_SSH_KEY: ${{ secrets.PREVIEW_DEPLOY_SSH_KEY }}
          PREVIEW_DEPLOY_KNOWN_HOSTS: ${{ secrets.PREVIEW_DEPLOY_KNOWN_HOSTS }}
          PREVIEW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_DEPLOY_SSH_KEY"
          test -n "$PREVIEW_DEPLOY_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PREVIEW_DEPLOY_SSH_KEY" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          printf '%s\n' "$PREVIEW_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp -i ~/.ssh/preview_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            images.tar.gz "preview-deploy@164.92.127.159:/var/lib/openagents-preview/incoming/$PREVIEW_SHA.tar.gz"
          ssh -i ~/.ssh/preview_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            preview-deploy@164.92.127.159 "sudo /usr/local/sbin/openagents-preview-deploy $PREVIEW_SHA"
      - name: Verify public readiness
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors \
            https://workspace-preview.openagents.org/ready
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            https://workspace-preview.openagents.org/login --output /dev/null
