name: Agent E2E Smoke Test

on:
  workflow_dispatch:
    inputs:
      agent_type:
        description: "Agent type to test (claude default; hermes also supported)"
        required: false
        default: claude
  push:
    branches: [develop]
    paths:
      - "packages/agent-connector/**"
      - "workspace/**"
      - "tests/e2e/**"
      - ".github/workflows/agent-e2e-smoke.yml"
  pull_request:
    branches: [develop]
    paths:
      - "packages/agent-connector/**"
      - "workspace/**"
      - "tests/e2e/**"
      - ".github/workflows/agent-e2e-smoke.yml"

env:
  AGENT_TYPE: ${{ inputs.agent_type || 'claude' }}
  # Claude (default) authenticates via ANTHROPIC_* — reuse the isolated E2E_*
  # gateway creds the launcher matrix uses. LLM_* stay for the hermes path.
  # No ANTHROPIC_MODEL: let Claude Code use its default (matches the green
  # nightly matrix; pinning claude-sonnet-4-6 here correlated with reply hangs).
  ANTHROPIC_API_KEY: ${{ secrets.E2E_ANTHROPIC_API_KEY }}
  ANTHROPIC_BASE_URL: ${{ secrets.E2E_ANTHROPIC_BASE_URL }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
  LLM_MODEL: ${{ secrets.LLM_MODEL }}
  E2E_WS_TOKEN: ${{ secrets.E2E_WS_TOKEN }}
  E2E_WS_SLUG: ${{ secrets.E2E_WS_SLUG }}
  WORKSPACE_API_BASE_URL: https://workspace-endpoint.openagents.org

jobs:
  agent-smoke:
    # ubuntu: the fast per-PR gate. The earlier claude hang was MCP-mode's
    # MCP-server subprocess (not a platform issue) — the smoke now runs the agent
    # in skills mode (no MCP), which works on Linux.
    # Fork PRs do not receive secrets so E2E_WS_TOKEN is empty; skip rather than fail.
    if: ${{ env.E2E_WS_TOKEN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: |
          cd packages/agent-connector
          npm ci || npm install

      - name: Link agn CLI
        run: |
          cd packages/agent-connector
          npm link

      - name: Run agent E2E smoke test
        run: node tests/e2e/agent-smoke.js

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ env.AGENT_TYPE }}-${{ github.run_id }}
          path: .e2e-logs/
          retention-days: 14
