name: Self-hosted release

# Cuts a self-hosted (open-source) release of the Workspace:
#   1. fast-forwards `release` to a develop commit (default develop HEAD),
#   2. tags it `openagents-v<version>` and creates a GitHub Release,
#   3. publishes the images used by workspace/selfhost/docker-compose.yml:
#        ghcr.io/<owner>/openagents-workspace-backend:<version> (+ :latest)
#        ghcr.io/<owner>/openagents-workspace-frontend:<version> (+ :latest)
#      The frontend is built with NEXT_PUBLIC_API_URL=/api (same-origin API
#      behind Caddy), so one image works on any domain.
#
# `release` never deploys anything; hosted production lives on
# openagents-release (promote-release.yml).
#
#   gh workflow run selfhost-release.yml -f version=1.0.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without the leading v, e.g. 1.0.0"
        required: true
      ref:
        description: "Commit on develop to release (default: develop HEAD)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: selfhost-release
  cancel-in-progress: false

jobs:
  release:
    name: Fast-forward release, tag and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Validate
        id: v
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like 1.2.3 or 1.2.3-rc.1"; exit 1
          fi
          TAG="openagents-v$VERSION"
          git fetch --quiet --tags origin develop release
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists"; exit 1
          fi
          TARGET_SHA=$(git rev-parse --verify "${REF:-origin/develop}^{commit}")
          REL_SHA=$(git rev-parse origin/release)
          git merge-base --is-ancestor "$TARGET_SHA" origin/develop || { echo "::error::$TARGET_SHA is not on develop"; exit 1; }
          git merge-base --is-ancestor "$REL_SHA" "$TARGET_SHA" || { echo "::error::release has commits not on develop; cannot fast-forward"; exit 1; }
          PREV=$(git tag -l 'openagents-v*' --sort=-v:refname | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"

      - name: Fast-forward release and push tag (promotion deploy key)
        env:
          SSH_KEY: ${{ secrets.RELEASE_PROMOTE_SSH_KEY }}
          SHA: ${{ steps.v.outputs.sha }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          [ -n "$SSH_KEY" ] || { echo "::error::RELEASE_PROMOTE_SSH_KEY secret is not set."; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/promote_key && chmod 600 ~/.ssh/promote_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/promote_key -o IdentitiesOnly=yes"
          git tag "$TAG" "$SHA"
          git push "git@github.com:${{ github.repository }}.git" "$SHA:refs/heads/release" "refs/tags/$TAG"

      - name: Build and push images
        env:
          SHA: ${{ steps.v.outputs.sha }}
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          BACKEND="ghcr.io/$OWNER/openagents-workspace-backend"
          FRONTEND="ghcr.io/$OWNER/openagents-workspace-frontend"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          git checkout --quiet "$SHA"
          LABELS=(--label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}"
                  --label org.opencontainers.image.version="$VERSION"
                  --label org.opencontainers.image.revision="$SHA")
          docker build --file workspace/backend/production.Dockerfile \
            --build-arg RELEASE_SHA="$SHA" "${LABELS[@]}" \
            --tag "$BACKEND:$VERSION" workspace/backend
          docker build --build-arg NEXT_PUBLIC_API_URL=/api "${LABELS[@]}" \
            --tag "$FRONTEND:$VERSION" workspace/frontend
          for IMAGE in "$BACKEND" "$FRONTEND"; do
            docker push "$IMAGE:$VERSION"
            if [[ "$VERSION" != *-* ]]; then
              docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
              docker push "$IMAGE:latest"
            fi
          done
          echo "BACKEND=$BACKEND" >> "$GITHUB_ENV"
          echo "FRONTEND=$FRONTEND" >> "$GITHUB_ENV"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          PREV: ${{ steps.v.outputs.prev }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          {
            echo "Self-hosted OpenAgents $VERSION."
            echo ""
            echo "Images: \`$BACKEND:$VERSION\`, \`$FRONTEND:$VERSION\`"
            echo ""
            echo "Setup: see [workspace/selfhost/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/$TAG/workspace/selfhost/README.md)."
            echo ""
            echo "### Changes"
            if [ -n "$PREV" ]; then git log --no-merges --format='- %s (%h)' "$PREV..$TAG" | head -200
            else echo "First self-hosted release."; fi
          } > notes.md
          FLAGS=()
          [[ "$VERSION" == *-* ]] && FLAGS+=(--prerelease)
          gh release create "$TAG" --title "OpenAgents $VERSION (self-hosted)" --notes-file notes.md --verify-tag "${FLAGS[@]}"
